<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="1350" rx="16" fill="url(#bgGrad)" />

  <!-- Title & Header -->
  <text x="450" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle">
    PROJECT 4: AI LEARNING CAPSTONE WORKFLOW
  </text>
  <text x="450" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Evidence-Driven Prompting, Rigorous Self-Review &amp; Process Documentation
  </text>

  <!-- 1. START -->
  <rect x="360" y="110" width="180" height="48" rx="24" fill="url(#startGrad)" filter="url(#shadow)" />
  <text x="450" y="140" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    ▶ START
  </text>

  <line x1="450" y1="158" x2="450" y2="190" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 2. Step 1 — Topic Brief -->
  <rect x="250" y="195" width="400" height="60" rx="12" fill="url(#stepGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="270" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#60a5fa">STEP 1</text>
  <text x="270" y="242" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#f1f5f9">Topic Brief (Topic, Audience, Goal, AI Tool)</text>

  <line x1="450" y1="255" x2="450" y2="285" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 3. Stage 1 — Weak Prompt -->
  <rect x="250" y="290" width="400" height="55" rx="10" fill="url(#stepGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)" />
  <text x="270" y="314" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">BRIEFING STAGE 1</text>
  <text x="270" y="333" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Weak Prompt: "Explain [TOPIC]."</text>

  <line x1="450" y1="345" x2="450" y2="375" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 4. Stage 2 — Context Prompt -->
  <rect x="250" y="380" width="400" height="55" rx="10" fill="url(#stepGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)" />
  <text x="270" y="404" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">BRIEFING STAGE 2</text>
  <text x="270" y="423" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Context Prompt: Audience, Level, Objectives</text>

  <line x1="450" y1="435" x2="450" y2="465" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 5. Stage 3 — Source Prompt -->
  <rect x="250" y="470" width="400" height="55" rx="10" fill="url(#stepGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)" />
  <text x="270" y="494" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">BRIEFING STAGE 3</text>
  <text x="270" y="513" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Source Prompt: Source vs Additional AI Info</text>

  <line x1="450" y1="525" x2="450" y2="555" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 6. Three Options -->
  <rect x="250" y="560" width="400" height="55" rx="10" fill="url(#stepGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)" />
  <text x="270" y="584" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ec4899">STEP 3 — PEDAGOGY</text>
  <text x="270" y="603" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Three Options (Option 1, Option 2, Option 3)</text>

  <line x1="450" y1="615" x2="450" y2="645" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 7. Choose + Reject -->
  <rect x="250" y="650" width="400" height="55" rx="10" fill="url(#stepGrad)" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)" />
  <text x="270" y="674" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fb7185">CRITICAL DECISION</text>
  <text x="270" y="693" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Choose One Approach + Reject Others with Reasons</text>

  <line x1="450" y1="705" x2="450" y2="735" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 8. Chapter Builder -->
  <rect x="220" y="740" width="460" height="65" rx="12" fill="url(#stepGrad)" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)" />
  <text x="240" y="764" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc">STEP 4 — CREATION</text>
  <text x="240" y="784" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Chapter Builder: 10 Configurable Sections</text>
  <text x="240" y="798" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">+ Flashcards, Quiz &amp; 7-Day Revision Plan</text>

  <line x1="450" y1="805" x2="450" y2="835" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 9. Rubric Scoring -->
  <rect x="250" y="840" width="400" height="55" rx="10" fill="url(#stepGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)" />
  <text x="270" y="864" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">STEP 5A — RUBRIC</text>
  <text x="270" y="883" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Rubric Scoring: Clarity, Accuracy, Age-fit, Revision</text>

  <line x1="450" y1="895" x2="450" y2="925" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 10. Fact Checker -->
  <rect x="250" y="930" width="400" height="55" rx="10" fill="url(#stepGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
  <text x="270" y="954" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">STEP 5B — VERIFICATION</text>
  <text x="270" y="973" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Fact Check: 6–10 Claims (No Fake Verification!)</text>

  <line x1="450" y1="985" x2="450" y2="1015" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 11. Process Notebook -->
  <rect x="250" y="1020" width="400" height="55" rx="10" fill="url(#stepGrad)" stroke="#475569" stroke-width="1.5" filter="url(#shadow)" />
  <text x="270" y="1044" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa">STEP 6 — DOCUMENTATION</text>
  <text x="270" y="1063" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Process Notebook: Log (8+), Sources (2+), Reflection</text>

  <line x1="450" y1="1075" x2="450" y2="1105" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 12. Completion Check -->
  <rect x="250" y="1110" width="400" height="50" rx="10" fill="url(#stepGrad)" stroke="#eab308" stroke-width="2" filter="url(#shadow)" />
  <text x="270" y="1132" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#facc15">VALIDATION GATE</text>
  <text x="270" y="1149" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#fef08a">Strict Completion Check (8 Criteria)</text>

  <line x1="450" y1="1160" x2="450" y2="1190" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 13. Export Actions -->
  <rect x="250" y="1195" width="400" height="50" rx="10" fill="url(#stepGrad)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)" />
  <text x="270" y="1217" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#22d3ee">DELIVERABLE</text>
  <text x="270" y="1234" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#e2e8f0">Export: Markdown (.md), Clipboard, Print / PDF</text>

  <line x1="450" y1="1245" x2="450" y2="1275" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- 14. CAPSTONE COMPLETE -->
  <rect x="320" y="1280" width="260" height="48" rx="24" fill="url(#successGrad)" filter="url(#shadow)" />
  <text x="450" y="1310" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">
    ★ CAPSTONE COMPLETE
  </text>
</svg>
